[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy", "Cython"]
build-backend = "setuptools.build_meta"

[project]
name = "chemical-diffusion-reactions"
version = "0.1.0"
description = "Reaction-diffusion pattern generation for morphogenesis and generative art"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Merry Pranxter", email = "merry@astraltrash.com"}
]
keywords = ["reaction-diffusion", "gray-scott", "turing-patterns", "morphogenesis", "generative-art"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "Pillow>=8.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=1.10.0",
    "torchvision>=0.11.0",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "Cython>=0.29.24",
]
docs = [
    "mkdocs>=1.2.0",
    "mkdocs-material>=7.2.0",
    "mkdocstrings[python]>=0.16.0",
]
all = [
    "chemical-diffusion-reactions[gpu,dev,docs]",
]

[project.scripts]
cdr-render = "tools.parameter_scanner:main"
cdr-video = "tools.video_generator:main"

[project.urls]
Homepage = "https://github.com/merrypranxter/chemical-diffusion-reactions"
Documentation = "https://chemical-diffusion-reactions.readthedocs.io"
Repository = "https://github.com/merrypranxter/chemical-diffusion-reactions"
Issues = "https://github.com/merrypranxter/chemical-diffusion-reactions/issues"

[tool.setuptools]
packages = ["core", "cpu", "gpu", "models", "tools", "tests"]

[tool.setuptools.package-data]
"presets" = ["*.json"]
"shaders" = ["*.glsl", "*.wgsl"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=core --cov=models --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "benchmark: marks benchmark tests",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
